<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Swaraj Gaikwad — Backend Developer</title>
  <desc id="desc">Animated futuristic neon backend developer banner from Nashik, India.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070914"/><stop offset=".55" stop-color="#0a0b1d"/><stop offset="1" stop-color="#100821"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset=".52" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="textGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".58" stop-color="#d9faff"/><stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".3"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#818cf8" stroke-opacity=".11" stroke-width=".7"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <clipPath id="clip"><rect width="1200" height="420" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <ellipse cx="950" cy="215" rx="370" ry="290" fill="url(#orb)"/>
    <ellipse cx="160" cy="30" rx="290" ry="190" fill="#0891b2" opacity=".08" filter="url(#softGlow)"/>
    <path d="M0 350 C210 295 310 440 520 370 S880 290 1200 350" fill="none" stroke="#8b5cf6" stroke-opacity=".18"/>
    <path d="M0 365 C230 310 360 445 560 385 S920 315 1200 370" fill="none" stroke="#22d3ee" stroke-opacity=".13"/>

    <!-- Ambient stars -->
    <g fill="#dbeafe">
      <circle cx="65" cy="62" r="1.4" opacity=".7"><animate attributeName="opacity" values=".2;.9;.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="400" cy="48" r="1.2" opacity=".6"><animate attributeName="opacity" values=".2;.8;.2" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="550" cy="82" r="1.6" opacity=".7"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="730" cy="55" r="1.2" opacity=".6"><animate attributeName="opacity" values=".2;.9;.2" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="75" r="1.4" opacity=".8"><animate attributeName="opacity" values=".3;1;.3" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="1070" cy="330" r="1.2" opacity=".6"><animate attributeName="opacity" values=".2;.9;.2" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="650" cy="320" r="1.4" opacity=".6"><animate attributeName="opacity" values=".2;.9;.2" dur="2.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Left identity -->
    <g transform="translate(74 74)">
      <rect x="0" y="0" width="208" height="28" rx="14" fill="#11152b" stroke="#4f46e5" stroke-opacity=".7"/>
      <circle cx="15" cy="14" r="4" fill="#34d399" filter="url(#glow)">
        <animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="18.5" fill="#b7c3e5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2">SYSTEM ONLINE</text>

      <text x="0" y="105" fill="#7182a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="4">// BUILDING THE ENGINE</text>
      <text x="-2" y="164" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="48" letter-spacing="1.2">SWARAJ</text>
      <text x="-2" y="218" fill="url(#textGlow)" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="48" letter-spacing="1.2">GAIKWAD</text>
      <rect x="0" y="236" width="88" height="3" rx="1.5" fill="url(#neon)" filter="url(#glow)"/>
      <text x="0" y="274" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" letter-spacing="3">BACKEND DEVELOPER</text>
      <g transform="translate(0 302)">
        <path d="M4 0 C-1 0 -3 5 -3 10 C-3 19 8 28 8 28 S19 19 19 10 C19 5 15 0 10 0 Z" fill="none" stroke="#22d3ee" stroke-width="1.5" transform="translate(0 -1) scale(.8)"/>
        <circle cx="8" cy="7" r="2.5" fill="#22d3ee"/>
        <text x="29" y="15" fill="#a7b4d2" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1.2">NASHIK, INDIA</text>
        <text x="0" y="47" fill="#536282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.5">APIs • SYSTEMS • REAL-TIME</text>
      </g>
    </g>

    <!-- Right side: abstract server core -->
    <g transform="translate(790 72)">
      <circle cx="175" cy="150" r="145" fill="none" stroke="#8b5cf6" stroke-opacity=".16" stroke-width="1"/>
      <circle cx="175" cy="150" r="119" fill="none" stroke="#22d3ee" stroke-opacity=".22" stroke-width="1" stroke-dasharray="3 9">
        <animateTransform attributeName="transform" type="rotate" from="0 175 150" to="360 175 150" dur="38s" repeatCount="indefinite"/>
      </circle>
      <ellipse cx="175" cy="150" rx="102" ry="42" fill="none" stroke="#8b5cf6" stroke-opacity=".5" transform="rotate(-34 175 150)"/>
      <ellipse cx="175" cy="150" rx="102" ry="42" fill="none" stroke="#22d3ee" stroke-opacity=".45" transform="rotate(34 175 150)"/>
      <circle cx="175" cy="150" r="74" fill="#0b1025" stroke="url(#neon)" stroke-width="1.5" filter="url(#glow)"/>
      <circle cx="175" cy="150" r="61" fill="#0b1227" stroke="#334155" stroke-width="1"/>
      <g transform="translate(137 111)">
        <rect x="0" y="0" width="76" height="25" rx="5" fill="#111b35" stroke="#22d3ee" stroke-opacity=".85"/>
        <rect x="0" y="31" width="76" height="25" rx="5" fill="#111b35" stroke="#a78bfa" stroke-opacity=".85"/>
        <rect x="0" y="62" width="76" height="25" rx="5" fill="#111b35" stroke="#22d3ee" stroke-opacity=".85"/>
        <g fill="#34d399">
          <circle cx="10" cy="12.5" r="2.5"><animate attributeName="opacity" values="1;.3;1" dur="1.7s" repeatCount="indefinite"/></circle>
          <circle cx="10" cy="43.5" r="2.5"><animate attributeName="opacity" values=".3;1;.3" dur="2.1s" repeatCount="indefinite"/></circle>
          <circle cx="10" cy="74.5" r="2.5"><animate attributeName="opacity" values="1;.3;1" dur="1.9s" repeatCount="indefinite"/></circle>
        </g>
        <path d="M20 10H64 M20 16H51 M20 41H64 M20 47H56 M20 72H64 M20 78H48" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Orbiting packets -->
      <circle cx="175" cy="5" r="4" fill="#22d3ee" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" from="0 175 150" to="360 175 150" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="175" cy="5" r="3" fill="#c4b5fd" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" from="180 175 150" to="540 175 150" dur="13s" repeatCount="indefinite"/>
      </circle>

      <!-- Network nodes and routes -->
      <g fill="none" stroke-width="1.2">
        <path d="M35 70 L72 88 L91 65" stroke="#22d3ee" stroke-opacity=".65"/>
        <path d="M267 72 L292 96 L315 80" stroke="#a78bfa" stroke-opacity=".7"/>
        <path d="M35 235 L70 218 L91 238" stroke="#a78bfa" stroke-opacity=".7"/>
        <path d="M267 230 L293 211 L318 229" stroke="#22d3ee" stroke-opacity=".65"/>
        <path d="M65 150 H14 V175" stroke="#64748b" stroke-opacity=".65" stroke-dasharray="3 5"/>
        <path d="M285 150 H330 V126" stroke="#64748b" stroke-opacity=".65" stroke-dasharray="3 5"/>
      </g>
      <g fill="#22d3ee" filter="url(#glow)">
        <circle cx="35" cy="70" r="3"/><circle cx="91" cy="65" r="3"/><circle cx="315" cy="80" r="3"/><circle cx="318" cy="229" r="3"/>
      </g>
      <g fill="#a78bfa" filter="url(#glow)">
        <circle cx="292" cy="96" r="3"/><circle cx="35" cy="235" r="3"/><circle cx="91" cy="238" r="3"/><circle cx="293" cy="211" r="3"/>
      </g>

      <!-- Tiny system labels -->
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.4" fill="#7786aa">
        <text x="8" y="53">REQUEST</text>
        <text x="270" y="57">ROUTING</text>
        <text x="11" y="260">DATABASE</text>
        <text x="267" y="253">RESPONSE</text>
      </g>
    </g>

    <!-- Bottom status rail -->
    <path d="M74 394 H1126" stroke="#334155" stroke-opacity=".7"/>
    <path d="M74 394 H275" stroke="url(#neon)" stroke-width="1.5" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0 220;220 0;0 220" dur="7s" repeatCount="indefinite"/>
    </path>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.5" fill="#64748b">
      <text x="74" y="411">DESIGNING WHAT RUNS BEHIND THE SCENES</text>
      <text x="1126" y="411" text-anchor="end">SG // 001</text>
    </g>
    <rect x=".75" y=".75" width="1198.5" height="418.5" rx="23.5" fill="none" stroke="url(#neon)" stroke-opacity=".6" stroke-width="1.5"/>
  </g>
</svg>
