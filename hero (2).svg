<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Swaraj Gaikwad — Backend Developer</title>
<desc id="desc">A cinematic animated cyberpunk skyline, neon data streams, holographic system core, and developer identity from Nashik, India.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03040b"/><stop offset=".48" stop-color="#0b0920"/><stop offset="1" stop-color="#050d18"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a855f7"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <linearGradient id="headline" x1="0" y1="0" x2="1" y2=".15"><stop stop-color="#fff"/><stop offset=".48" stop-color="#dffaff"/><stop offset=".78" stop-color="#b8a4ff"/><stop offset="1" stop-color="#f0abfc"/></linearGradient>
  <linearGradient id="city" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1b1744"/><stop offset="1" stop-color="#070914"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#7c3aed" stop-opacity=".42"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  <radialGradient id="cyanHalo"><stop stop-color="#06b6d4" stop-opacity=".28"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".09" stroke-width=".7"/></pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
  <clipPath id="frame"><rect width="1200" height="440" rx="24"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="440" fill="url(#bg)"/>
  <rect width="1200" height="440" fill="url(#grid)"/>
  <ellipse cx="870" cy="190" rx="430" ry="300" fill="url(#halo)"/>
  <ellipse cx="180" cy="300" rx="330" ry="210" fill="url(#cyanHalo)"/>

  <!-- Perspective data grid -->
  <g stroke="#22d3ee" stroke-opacity=".14" fill="none">
    <path d="M0 365H1200M0 385H1200M0 405H1200M0 425H1200"/>
    <path d="M600 260L0 440M600 260L130 440M600 260L290 440M600 260L440 440M600 260L760 440M600 260L910 440M600 260L1080 440M600 260L1200 420"/>
  </g>

  <!-- Neon city skyline -->
  <g stroke="#5b4b9b" stroke-width="1" fill="url(#city)" opacity=".9">
    <path d="M0 355V255H44V220H72V275H105V237H138V355Z"/>
    <path d="M110 355V290H145V208H173V180H187V208H207V355Z"/>
    <path d="M210 355V265H248V229H275V267H299V355Z"/>
    <path d="M865 355V267H896V225H922V267H946V355Z"/>
    <path d="M940 355V232H968V191H985V232H1013V355Z"/>
    <path d="M1010 355V278H1044V219H1070V246H1095V188H1115V245H1144V355Z"/>
    <path d="M1128 355V270H1165V230H1200V355Z"/>
  </g>
  <g fill="#22d3ee" opacity=".8">
    <path d="M18 274h10v3H18zM18 292h10v3H18zM18 310h10v3H18zM54 238h5v9h-5zM54 255h5v9h-5z"/>
    <path d="M155 225h5v10h-5zM176 225h5v10h-5zM155 246h5v10h-5zM176 246h5v10h-5zM155 267h5v10h-5zM176 267h5v10h-5z"/>
    <path d="M228 282h6v3h-6zM252 282h6v3h-6zM228 300h6v3h-6zM252 300h6v3h-6z"/>
    <path d="M964 249h5v10h-5zM986 249h5v10h-5zM964 270h5v10h-5zM986 270h5v10h-5z"/>
    <path d="M1050 250h5v10h-5zM1072 250h5v10h-5zM1050 271h5v10h-5zM1072 271h5v10h-5zM1120 266h5v10h-5zM1142 266h5v10h-5z"/>
  </g>

  <!-- Giant holographic reactor / network core -->
  <g transform="translate(920 166)">
    <circle r="132" fill="none" stroke="#8b5cf6" stroke-opacity=".16" stroke-width="1"/>
    <circle r="111" fill="none" stroke="#22d3ee" stroke-opacity=".55" stroke-width="1.2" stroke-dasharray="2 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="42s" repeatCount="indefinite"/>
    </circle>
    <circle r="88" fill="none" stroke="#c084fc" stroke-opacity=".65" stroke-width="1.5" stroke-dasharray="48 12 4 12">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
    </circle>
    <ellipse rx="105" ry="39" fill="none" stroke="#22d3ee" stroke-opacity=".7" transform="rotate(55)"/>
    <ellipse rx="105" ry="39" fill="none" stroke="#c084fc" stroke-opacity=".7" transform="rotate(-55)"/>
    <circle r="62" fill="#090d21" stroke="url(#edge)" stroke-width="2" filter="url(#glow)"/>
    <circle r="52" fill="#10112a" stroke="#4c3d80"/>
    <g stroke="#22d3ee" stroke-width="1.5" fill="none" opacity=".95">
      <path d="M-26 -24H17L29 -12V15L17 27H-26L-35 18V-15Z"/>
      <path d="M-16 -12H13M-16 0H20M-16 12H8"/>
    </g>
    <g fill="#e9d5ff" filter="url(#glow)">
      <circle cx="-47" cy="-57" r="3"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="77" cy="-16" r="3"><animate attributeName="opacity" values="1;.25;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="13" cy="101" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
    </g>
    <circle cx="0" cy="-111" r="4" fill="#22d3ee" filter="url(#glow)"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="0" cy="-88" r="3" fill="#f0abfc" filter="url(#glow)"><animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="11s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Moving data beams -->
  <g fill="none" stroke-width="1.4">
    <path d="M0 102H320L352 134H460" stroke="#22d3ee" stroke-opacity=".55"/>
    <path d="M0 109H315L348 142H445" stroke="#22d3ee" stroke-opacity=".2"/>
    <path d="M1200 80H1090L1055 115H1018" stroke="#c084fc" stroke-opacity=".65"/>
    <path d="M0 328H280L310 298H440" stroke="#a855f7" stroke-opacity=".5"/>
    <path d="M1200 325H1110L1082 297H1030" stroke="#22d3ee" stroke-opacity=".55"/>
  </g>
  <g fill="#67e8f9" filter="url(#glow)">
    <circle r="3" cy="102"><animate attributeName="cx" values="-10;460;-10" dur="6s" repeatCount="indefinite"/></circle>
    <circle r="2.5" cy="328"><animate attributeName="cx" values="1200;310;1200" dur="7s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#d8b4fe" filter="url(#glow)">
    <circle r="3" cy="80"><animate attributeName="cx" values="1200;1018;1200" dur="5s" repeatCount="indefinite"/></circle>
    <circle r="2.5" cy="325"><animate attributeName="cx" values="1200;1082;1200" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Identity panel -->
  <g transform="translate(72 64)">
    <path d="M0 0H250L266 16V39H0Z" fill="#0c1224" stroke="#22d3ee" stroke-opacity=".7"/>
    <circle cx="17" cy="19" r="4" fill="#4ade80" filter="url(#glow)"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="31" y="23" fill="#a5f3fc" font-family="monospace" font-size="11" letter-spacing="2">ONLINE // SYSTEM READY</text>
    <text x="0" y="83" fill="#7c8aa9" font-family="monospace" font-size="12" letter-spacing="3">HELLO, WORLD. I'M</text>
    <text x="-2" y="145" fill="url(#headline)" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" letter-spacing="-1.8">SWARAJ</text>
    <text x="-2" y="202" fill="url(#headline)" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" letter-spacing="-1.8">GAIKWAD<tspan fill="#22d3ee">.</tspan></text>
    <path d="M0 219H282" stroke="url(#edge)" stroke-width="2" filter="url(#glow)"/>
    <text x="0" y="254" fill="#f8fafc" font-family="monospace" font-size="17" font-weight="700" letter-spacing="2.3">BACKEND DEVELOPER</text>
    <text x="0" y="279" fill="#91a3c8" font-family="Arial, Helvetica, sans-serif" font-size="13">Building the invisible. Powering the experience.</text>
    <g transform="translate(0 313)">
      <path d="M6 0C-1 0 -5 5 -5 11C-5 20 7 30 7 30S19 20 19 11C19 5 13 0 6 0Z" fill="none" stroke="#22d3ee" stroke-width="1.6" transform="scale(.78)"/>
      <circle cx="5" cy="8" r="2.5" fill="#22d3ee"/>
      <text x="28" y="16" fill="#dbeafe" font-family="monospace" font-size="13" letter-spacing="2">NASHIK, INDIA</text>
      <text x="28" y="34" fill="#65769b" font-family="monospace" font-size="9.5" letter-spacing="1.8">MAHARASHTRA · IN</text>
    </g>
  </g>

  <!-- Floating telemetry cards -->
  <g font-family="monospace">
    <g transform="translate(73 400)">
      <path d="M0 0H245L257 12H0Z" fill="#0a1222" stroke="#334155"/>
      <circle cx="12" cy="7" r="2.5" fill="#4ade80"/>
      <text x="23" y="10" fill="#94a3b8" font-size="8.5" letter-spacing="1.4">API STATUS: OPERATIONAL</text>
    </g>
    <g transform="translate(824 350)">
      <path d="M0 0H240L252 12V34H0Z" fill="#0a1222" fill-opacity=".9" stroke="#7c3aed" stroke-opacity=".7"/>
      <text x="13" y="14" fill="#c4b5fd" font-size="9" letter-spacing="1.4">CORE / NETWORK</text>
      <text x="13" y="27" fill="#67e8f9" font-size="10">PACKETS FLOWING <tspan fill="#4ade80">●</tspan></text>
    </g>
  </g>

  <!-- Scan sweep -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#edge)" opacity=".8" filter="url(#glow)">
    <animate attributeName="y" values="-4;440;-4" dur="9s" repeatCount="indefinite"/>
  </rect>
  <g fill="#e0f2fe">
    <circle cx="333" cy="42" r="1.5"><animate attributeName="opacity" values=".1;1;.1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="535" cy="67" r="1.2"><animate attributeName="opacity" values="1;.15;1" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="706" cy="40" r="1.5"><animate attributeName="opacity" values=".1;1;.1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1164" cy="132" r="1.5"><animate attributeName="opacity" values="1;.15;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="734" cy="305" r="1.2"><animate attributeName="opacity" values=".1;1;.1" dur="2.7s" repeatCount="indefinite"/></circle>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="438.5" rx="23.5" fill="none" stroke="url(#edge)" stroke-opacity=".75" stroke-width="1.5"/>
</g>
</svg>